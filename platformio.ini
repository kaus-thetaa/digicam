[platformio]
default_envs = esp32cam-ota-safe
src_dir = src
include_dir = include

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32cam
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_ota.csv
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
upload_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3

[env:esp32cam-serial]
upload_protocol = esptool
build_flags =
    ${env.build_flags}
    -DDIGICAM_I2C_ON_UART_PINS=0
    -DDIGICAM_ENABLE_JOYSTICK=0

[env:esp32cam-ota-safe]
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
    --port=3232
    --auth=DigiCamOTA2026
build_flags =
    ${env.build_flags}
    -DDIGICAM_I2C_ON_UART_PINS=0
    -DDIGICAM_ENABLE_JOYSTICK=0

[env:esp32cam-ota-r7]
lib_deps =
    olikraus/U8g2
    adafruit/Adafruit ADS1X15
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
    --port=3232
    --auth=DigiCamOTA2026
build_flags =
    ${env.build_flags}
    -DDIGICAM_I2C_ON_UART_PINS=1
    -DDIGICAM_ENABLE_JOYSTICK=1
    -DDIGICAM_BUILD_ID=\"DigiCam-R7-standalone\"


; Explicit profile for OLED wired SDA=GPIO3, SCL=GPIO1. TX/RX wires must be disconnected.
[env:esp32cam-ota-r7-oled-3-1]
lib_deps =
    olikraus/U8g2
    adafruit/Adafruit ADS1X15
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
    --port=3232
    --auth=DigiCamOTA2026
build_flags =
    ${env.build_flags}
    -DDIGICAM_I2C_ON_UART_PINS=1
    -DDIGICAM_I2C_ENABLED=1
    -DDIGICAM_I2C_USES_UART=1
    -DDIGICAM_I2C_SDA_GPIO=3
    -DDIGICAM_I2C_SCL_GPIO=1
    -DDIGICAM_ENABLE_JOYSTICK=1
    -DDIGICAM_BUILD_ID=\"DigiCam-R7.1-oled-3-1\"

; Alternative profile for an existing physical wiring SDA=GPIO13, SCL=GPIO12.
; GPIO12 is a strapping pin; only use if ESP32 reliably boots with the OLED attached.
[env:esp32cam-ota-r7-oled-13-12]
lib_deps =
    olikraus/U8g2
    adafruit/Adafruit ADS1X15
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
    --port=3232
    --auth=DigiCamOTA2026
build_flags =
    ${env.build_flags}
    -DDIGICAM_I2C_ON_UART_PINS=0
    -DDIGICAM_I2C_ENABLED=1
    -DDIGICAM_I2C_USES_UART=0
    -DDIGICAM_I2C_SDA_GPIO=13
    -DDIGICAM_I2C_SCL_GPIO=12
    -DDIGICAM_ENABLE_JOYSTICK=1
    -DDIGICAM_BUILD_ID=\"DigiCam-R7.1-oled-13-12\"
